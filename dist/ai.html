);border-radius:99px;animation:spin .75s linear infinite}

;min-height:39px;border:1px solid #e4e1db;border-radius:99px;padding:8px 12px;background:#fff;color:#363733;font-size:11px;font-weight:800;cursor:pointer;transition:.2s}.voice-control:hover{border-color:rgba(242,28,43,.55);color:var(--red);transform:translateY(-1px)}.voice-control svg{width:16px;height:16px}.voice-control.listening{border-color:var(--red);background:#fff0f1;color:var(--red);box-shadow:0 0 0 5px rgba(242,28,43,.1)}.voice-control.listening .voice-text{min-width:75px}.voice-control:disabled{opacity:.45;cursor:not-allowed;transform:none}.send{display:grid;place-items:center;flex:0 0 auto;width:39px;height:39px;border:0;border-radius:50%;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 7px 13px rgba(242,28,43,.24);transition:transform .2s,background .2s}.send:hover{transform:translateY(-2px);background:var(--red-dark)}.send:disabled{background:#c4c3bd;box-shadow:none;cursor:wait;transform:none}.send svg{width:18px;height:18px}.hidden-input{display:none}.note{max-width:600px;margin:15px auto 0;color:#85857e;font-size:11px;line-height:1.45;text-align:center}.note b{color:#565751}

<body><div class="backdrop" aria-hidden="true"><div class="wash one"></div><div class="wash two"></div><div class="wash three"></div></div><header class="topbar"><div class="brand"><a class="brand-home" href="index.html" aria-label="Zupotsu home"><img class="brand-logo" src="zupotsu-logo-clean.png" alt="Zupotsu" /></a><span class="brand-copy"><b>ZUPOTSU AI</b><span class="powered-by">Built by <a href="https://shauryaai.vercel.app/" target="_blank" rel="noopener noreferrer">ShauryaaAI</a></span></span></div><div class="top-actions"><span class="status"><i></i>Live</span><a class="top-link" href="index.html">← Back to Zupotsu</a></div></header>
<main class="page"><section class="chat-shell" aria-label="Zupotsu AI chat"><div class="intro" id="intro"><div class="mark"><img src="zupotsu-short-mark-transparent.png" alt="Zupotsu" /></div><h1>Your next sports move,<br><em>made clearer.</em></h1><p>Ask about teams, athletes, sponsorships, sport business, or the world beyond the game.</p></div><div class="prompt-grid" id="prompts"><button class="prompt" type="button"><i>↗</i>How can an EV brand enter Indian sport?</button><button class="prompt" type="button"><i>↗</i>Build an IPL sponsorship shortlist for a new FMCG launch.</button><button class="prompt" type="button"><i>↗</i>Which sports opportunities best reach Gen Z in India?</button><button class="prompt" type="button"><i>↗</i>Compare cricket partnership routes for 2026.</button></div><div class="conversation" id="conversation" aria-live="polite"></div>
<form class="composer" id="chat-form"><div class="attachment-row" id="attachments"></div><textarea id="question" aria-label="Ask Zupotsu AI" placeholder="Ask a sports question…"></textarea><div class="composer-bar"><label class="icon-button" title="Attach reference files">＋<input class="hidden-input" id="file-input" type="file" multiple /></label><button class="toggle on" id="web-toggle" type="button" aria-pressed="true"><span class="switch"></span>Live web</button><button class="toggle research-toggle" id="research-toggle" type="button" aria-pressed="false">Research</button><span class="bar-spacer"></span><span class="model">Zupotsu AI</span><button class="voice-control" id="mic" type="button" aria-label="Start voice input" title="Speak your question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"></path></svg><span class="voice-text">Speak</span></button><button class="send" id="send" type="submit" aria-label="Send question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></form><p class="note"><b>Live-web answers.</b> Zupotsu AI can make mistakes—verify high-stakes decisions and source material.</p></section></main>
<script>
const form=document.querySelector('#chat-form'),question=document.querySelector('#question'),send=document.querySelector('#send'),conversation=document.querySelector('#conversation'),intro=document.querySelector('#intro'),prompts=document.querySelector('#prompts'),fileInput=document.querySelector('#file-input'),attachments=document.querySelector('#attachments'),webToggle=document.querySelector('#web-toggle'),researchToggle=document.querySelector('#research-toggle'),mic=document.querySelector('#mic'),history=[],files=[];let web=true,research=false;const apiUrl=location.hostname==='localhost'&&location.port==='4174'?'http://localhost:4175/api/chat':'/api/chat',rotatingPrompts=['Ask about a sport, brand, or sponsorship…','Compare Shami and Bumrah for a campaign brief.','Which league fits a Gen Z brand in India?','Build a shortlist for a 2026 launch.'];let promptIndex=0;setInterval(()=>{if(!question.value){question.classList.add('placeholder-swap');setTimeout(()=>{promptIndex=(promptIndex+1)%rotatingPrompts.length;question.placeholder=rotatingPrompts[promptIndex];question.classList.remove('placeholder-swap')},180)}},4000);const escapeHtml=v=>v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inline=v=>escapeHtml(v).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const formatAnswer=v=>{let h='',list=false;for(const raw of v.split(/\r?\n/)){const l=raw.trim();if(!l){if(list){h+='</ul>';list=false}continue}if(/^\|?\s*:?-{3,}/.test(l))continue;if((l.match(/\|/g)||[]).length>=2){if(list){h+='</ul>';list=false}const cells=l.split('|').map(x=>x.trim()).filter(Boolean);h+=`<div class="data-row">${cells.map(c=>`<span>${inline(c)}</span>`).join('')}</div>`;continue}if(/^#{1,3}\s+/.test(l)){if(list){h+='</ul>';list=false}h+=`<h3>${inline(l.replace(/^#{1,3}\s+/,''))}</h3>`;continue}if(/^[-•]\s+/.test(l)){if(!list){h+='<ul>';list=true}h+=`<li>${inline(l.replace(/^[-•]\s+/,''))}</li>`;continue}if(list){h+='</ul>';list=false}h+=`<p>${inline(l)}</p>`}return h+(list?'</ul>':'')};
const addMessage=(text,kind)=>{const wrap=document.createElement('div');wrap.className=`message ${kind}`;if(kind==='user')wrap.innerHTML=`<div class="question-card">${escapeHtml(text)}</div>`;else if(kind==='loading')wrap.innerHTML='<div class="loading-card"><span class="spinner"></span>Searching the web and shaping your answer…</div>';else wrap.innerHTML=`<article class="answer-card"><div class="answer-header"><span class="mini-mark"><img src="zupotsu-favicon.png" alt="" /></span>Zupotsu AI</div><div class="answer-content">${formatAnswer(text)}</div></article>`;conversation.append(wrap);return wrap};
const renderFiles=()=>attachments.innerHTML=files.map((f,i)=>`<span class="attachment">⌁ ${escapeHtml(f.name)} <button type="button" data-index="${i}" aria-label="Remove ${escapeHtml(f.name)}">×</button></span>`).join('');attachments.addEventListener('click',e=>{if(e.target.dataset.index!==undefined){files.splice(Number(e.target.dataset.index),1);renderFiles()}});fileInput.addEventListener('change',()=>{files.push(...Array.from(fileInput.files).slice(0,4-files.length));renderFiles();fileInput.value=''});const setToggle=(b,v)=>{b.classList.toggle('on',v);b.setAttribute('aria-pressed',String(v))};webToggle.addEventListener('click',()=>{web=!web;setToggle(webToggle,web)});researchToggle.addEventListener('click',()=>{research=!research;setToggle(researchToggle,research)});
const ask=async value=>{const prompt=value.trim();if(!prompt)return;intro.hidden=true;prompts.hidden=true;conversation.classList.add('show');addMessage(prompt,'user');history.push({role:'user',content:prompt});question.value='';question.disabled=true;send.disabled=true;const loading=addMessage('','loading');try{const res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-8),options:{web,research}})}),data=await res.json();if(!res.ok)throw new Error(data.error||'The AI service is unavailable.');loading.remove();addMessage(data.answer,'assistant');history.push({role:'assistant',content:data.answer});conversation.lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){loading.remove();addMessage(e.message||'Something went wrong. Please try again.','assistant')}finally{question.disabled=false;send.disabled=false;question.focus()}};form.addEventListener('submit',e=>{e.preventDefault();ask(question.value)});question.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});question.addEventListener('input',()=>{question.style.height='auto';question.style.height=`${Math.min(question.scrollHeight,220)}px`});const sharedPrompt=new URLSearchParams(location.search).get('ask');if(sharedPrompt){question.value=sharedPrompt;question.dispatchEvent(new Event('input'))}document.querySelectorAll('.prompt').forEach(b=>b.addEventListener('click',()=>ask(b.textContent.replace('↗','').trim())));
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;let listening=false,recognition=null;const micIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"></path></svg>';const stopIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"></rect></svg>';const setMicState=active=>{listening=active;mic.classList.toggle('listening',active);mic.setAttribute('aria-label',active?'Stop listening':'Start voice input');mic.title=active?'Stop listening':'Speak your question';mic.innerHTML=(active?stopIcon:micIcon)+'<span class="voice-text">'+(active?'Stop listening':'Speak')+'</span>'};if(!Speech){mic.disabled=true;mic.title='Voice input is unavailable in this browser'}else{recognition=new Speech();recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>setMicState(true);recognition.onresult=e=>{question.value=Array.from(e.results).map(x=>x[0].transcript).join('');question.dispatchEvent(new Event('input'))};recognition.onerror=()=>setMicState(false);recognition.onend=()=>setMicState(false);mic.addEventListener('click',()=>{if(listening)recognition.stop();else recognition.start()})}
</script></body></html>
